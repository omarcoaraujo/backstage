name: Check
on:
  workflow_dispatch:
  workflow_call:
  push:
  pull_request:
jobs:
  style:
    name: Style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rokit
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check formatting
        run: stylua --check src example stories tests cli bench

  cli:
    name: CLI specs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rokit
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run the specs
        run: lute run tests/cli/run.luau

  wally:
    name: Wally package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rokit
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the package
        run: bash scripts/wally_build.sh

      - name: Pack it
        run: wally package --project-path build/wally --output build/backstage-wally.zip

  analyze:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rokit
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pesde
        uses: axiom-co/setup-pesde@b690699ace34169731b6b2a1c93b2008472038a7
        with:
          token: ${{ github.token }}

      - name: Install packages
        run: pesde install

      - name: Generate the sourcemap
        run: rojo sourcemap dev.project.json --output sourcemap.json

      - name: Download the Roblox definitions
        run: curl -sL https://raw.githubusercontent.com/JohnnyMorganz/luau-lsp/main/scripts/globalTypes.d.luau -o roblox.d.luau

      - name: Type check
        run: luau-lsp analyze --definitions=roblox.d.luau --sourcemap=sourcemap.json --ignore "**/roblox_packages/**" src example stories tests/lib

      - name: Generate the benchmark sourcemap
        run: rojo sourcemap bench.project.json --output bench-sourcemap.json

      - name: Type check the benchmarks
        run: luau-lsp analyze --definitions=roblox.d.luau --sourcemap=bench-sourcemap.json --ignore "**/roblox_packages/**" bench/lib
