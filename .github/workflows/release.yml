name: Release
on:
  workflow_dispatch:
  release:
    types: [published]
jobs:
  check:
    uses: ./.github/workflows/check.yml
    secrets: inherit

  binaries:
    name: Build the CLI for ${{ matrix.target }}
    needs: [check]
    if: github.event_name == 'release'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, target: linux-x86_64, executable: backstage }
          - { runner: ubuntu-24.04-arm, target: linux-aarch64, executable: backstage }
          - { runner: macos-latest, target: macos-aarch64, executable: backstage }
          - { runner: windows-latest, target: windows-x86_64, executable: backstage.exe }
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rokit
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pesde
        uses: axiom-co/setup-pesde@b690699ace34169731b6b2a1c93b2008472038a7
        with:
          token: ${{ github.token }}

      - name: Install the CLI packages
        shell: bash
        working-directory: cli
        run: pesde install

      - name: Compile
        shell: bash
        run: lute compile cli/init.luau --output ${{ matrix.executable }}

      - name: Zip
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a backstage-${{ matrix.target }}.zip ${{ matrix.executable }}
          else
            zip backstage-${{ matrix.target }}.zip ${{ matrix.executable }}
          fi

      - name: Attach to the release
        shell: bash
        run: gh release upload "${{ github.event.release.tag_name }}" backstage-${{ matrix.target }}.zip --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish the library
    runs-on: ubuntu-latest
    needs: [check]
    if: github.event_name == 'release'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pesde
        uses: axiom-co/setup-pesde@b690699ace34169731b6b2a1c93b2008472038a7
        with:
          token: ${{ github.token }}

      - name: Log in to pesde
        run: pesde auth login --token "$PESDE_AUTH"
        env:
          PESDE_AUTH: ${{ secrets.PESDE_AUTH }}

      - name: Install
        run: pesde install

      - name: Publish
        run: pesde publish -y
