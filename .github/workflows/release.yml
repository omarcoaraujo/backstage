name: Release
on:
  workflow_dispatch:
  release:
    types: [published]
jobs:
  check:
    uses: ./.github/workflows/check.yml
    secrets: inherit

  publish:
    name: Publish the library
    runs-on: ubuntu-latest
    needs: [check]
    if: github.event_name == 'release'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pesde
        uses: axiom-co/setup-pesde@b690699ace34169731b6b2a1c93b2008472038a7
        with:
          token: ${{ github.token }}

      - name: Log in to pesde
        run: pesde auth login --token "$PESDE_AUTH"
        env:
          PESDE_AUTH: ${{ secrets.PESDE_AUTH }}

      - name: Install
        run: pesde install

      - name: Publish
        run: pesde publish -y
